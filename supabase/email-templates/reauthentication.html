<!doctype html>
<html>
  <body style="margin:0;background:#eef7ff;font-family:Arial,Helvetica,sans-serif;color:#0f172a;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">Use this code to confirm it is you.</div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#eef7ff;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:620px;background:#ffffff;border:1px solid #d9edff;border-radius:18px;overflow:hidden;">
            <tr>
              <td style="background:#1767cc;padding:28px 30px;color:#ffffff;">
                <div style="font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;">ABS Connect</div>
                <h1 style="margin:12px 0 0;font-size:28px;line-height:34px;">Confirm it is you</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:30px;">
                <p style="margin:0 0 16px;font-size:16px;line-height:24px;color:#334155;">Enter this one-time code in ABS Connect to continue with the sensitive account action.</p>
                <div style="border-radius:18px;background:#f8fafc;padding:24px;border:1px solid #e2e8f0;text-align:center;margin:24px 0;">
                  <p style="margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#64748b;">Verification code</p>
                  <p style="margin:0;font-size:34px;font-weight:700;letter-spacing:8px;color:#0f172a;">{{ .Token }}</p>
                </div>
                <p style="margin:0;font-size:13px;line-height:20px;color:#64748b;">If you did not request this code, you can ignore this email. Do not share this code with anyone.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
